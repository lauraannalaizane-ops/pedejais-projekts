{% extends "base.html" %}
{% block title %}Nations Cup{% endblock %}
{% block content %}
<h1>Nations Cup</h1>
<div class="selection-container">
    {% for Cup in Gender %}
    <a class="gender-pick" href="{{ url_for('nation_show', gender_id=Cup['id']) }}">
        <img src="{{ url_for('static', filename='images/icons/' + Cup['picture']) }}" alt="{{ Cup['name'] }}" class="gender-picture">
        <div class="gender-name">{{ Cup["gender"] }}</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
