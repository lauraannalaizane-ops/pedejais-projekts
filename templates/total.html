{% extends "base.html" %}
{% block title %}Total Score{% endblock %}
{% block content %}
<h1 class="page-title">Total Score</h1>
<div class="selection-container">
    {% for strunt in Gender %}
    <a class="gender-pick" href="{{ url_for('total_show', gender_id=strunt['id']) }}">
        <img src="{{ url_for('static', filename='images/icons/' + strunt['picture']) }}" alt="{{ strunt['name'] }}" class="gender-picture">
        <div class="gender-name">{{ strunt["gender"] }}</div>
    </a>
    {% endfor %}

</div>
{% endblock %}
{% block footer%}
    <footer class="ipasa">
        <p><img src="{{ url_for('static', filename='images/logo2.png') }}" alt="Logo2" class="logo2"></p>
    </footer>
{%endblock%}
