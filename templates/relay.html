{% extends "base.html" %}
{% block title %}Relay{% endblock %}
{% block content %}
<h1 class="page-title">Relay</h1>
<div class="selection-container">
    {% for Relay in Gender %}
    <a class="gender-pick" href="{{ url_for('relay_show', gender_id=Relay['id']) }}">
        <img src="{{ url_for('static', filename='images/icons/' + Relay['picture']) }}" alt="{{ Relay['name'] }}" class="gender-picture">
        <div class="gender-name">{{ Relay["gender"] }}</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
{% block footer%}
    <footer class="ipasa">
        <p><img src="{{ url_for('static', filename='images/logo2.png') }}" alt="Logo2" class="logo2"></p>
    </footer>
{%endblock%}
