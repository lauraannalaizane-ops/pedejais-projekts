<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
        <nav>
            <a href="/">Home page</a>
            <a href="/kopejais">Total Score</a>
            <a href="/stafete">Relay</a>
            <a href="/valstu">Nations Cup</a>
            {% if session.user_id %}
                <!-- Show these when user is logged in -->
                <a href="/profile">Profile</a>
                <a href="/logout">Log Out</a>
            {% else %}
                <!-- Show this when user is logged out -->
                <a href="/log-in">Log In</a>
            {% endif %}

        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block footer%}
    <footer class="ipasais1">
        <p><img src="{{ url_for('static', filename='images/logo2.png') }}" alt="Logo2" class="logo2"></p>
    </footer>
    {%endblock%}
</body>
</html>
